name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck every shell script
        run: git ls-files '*.sh' | xargs -r shellcheck

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render the override template with dummy values
        run: |
          export EL_IMAGE=example/el:ci \
                 CL_IMAGE=example/cl:ci \
                 EL_ENODE='enode://00@127.0.0.1:30303' \
                 CL_ENR='enr:-ci-dummy'
          envsubst '${EL_IMAGE} ${CL_IMAGE} ${EL_ENODE} ${CL_ENR}' \
            < templates/compose.override.yaml.tmpl > compose.override.yaml
      - name: validate the merged stack
        run: docker compose config -q
