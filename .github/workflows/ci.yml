name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install envsubst
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext-base
      - name: run the CI gate (same script runs locally)
        run: tests/ci.sh
