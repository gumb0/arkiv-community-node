# Static part of the stack. The image pins and client command lines live in
# compose.override.yaml, which setup.sh renders from the network artifacts —
# compose merges the two files automatically, so plain `docker compose ps`,
# `logs`, `down` work with no extra flags.
name: arkiv-community-node

services:
  execution:
    volumes:
      - ./artifacts:/gen:ro
      - ./secrets:/secrets:ro
      - ./healthchecks:/hc:ro
      - el-data:/data
    ports:
      # Loopback only: the RPC is for this host, never for the internet.
      - "127.0.0.1:${EL_RPC_PORT:-8545}:8545"
    restart: unless-stopped
    # A maximum, not a delay: docker continues as soon as the client exits.
    # Killing it mid-flush costs recovery work, or a repair, on the next start.
    stop_grace_period: 3m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "bash", "/hc/el.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      # "Serving RPC" — up within minutes of start. Being current is the
      # consensus check's claim, not this one's.
      start_period: 5m

  consensus:
    # Plain start-order dependency, deliberately NOT
    # `condition: service_healthy`: the execution client only becomes
    # healthy (synced) when the beacon node drives it over the engine API —
    # waiting for health before starting the beacon node would deadlock.
    depends_on:
      - execution
    volumes:
      - ./artifacts:/gen:ro
      - ./secrets:/secrets:ro
      - ./healthchecks:/hc:ro
      - cl-data:/data
    ports:
      - "127.0.0.1:${CL_HTTP_PORT:-5052}:5052"
    restart: unless-stopped
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "bash", "/hc/cl.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Green only when the whole node is current (see cl.sh). A first sync
      # from genesis takes hours: this badge stays at "starting" for that
      # window; a restart of a synced node goes green in minutes.
      start_period: 6h

  # Optional: the tunnel client — serve the RPC from behind NAT via a
  # tunnel server. Off unless the tunnel profile is enabled
  # (COMPOSE_PROFILES in .env). setup.sh renders frpc.toml from the
  # TUNNEL_* values in .env.
  tunnel:
    profiles: ["tunnel"]
    build: ./tunnel
    depends_on:
      - execution
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
      - ./healthchecks:/hc:ro
    ports:
      # frpc's own status endpoint, for status.sh. Loopback only.
      - "127.0.0.1:${TUNNEL_STATUS_PORT:-7400}:7400"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "sh", "/hc/tunnel.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Connecting takes seconds; anything longer is a config problem
      # worth showing.
      start_period: 30s

  # Optional: on-box monitoring (Uptime Kuma) — alerts the operator when a
  # badge goes bad, instead of waiting to be looked at. Off unless the
  # monitor profile is enabled (COMPOSE_PROFILES in .env). Suggested
  # monitors and the alerting setup: README.
  monitor:
    profiles: ["monitor"]
    image: louislam/uptime-kuma:2.4.0@sha256:91e963bfda569ba115206e843febb446f473ab525add4e08b2b9e3beffa16985
    volumes:
      - kuma-data:/app/data
    ports:
      # The web UI, loopback only — reach it over SSH port forwarding.
      - "127.0.0.1:${MONITOR_UI_PORT:-3001}:3001"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  el-data:
  cl-data:
  kuma-data:
